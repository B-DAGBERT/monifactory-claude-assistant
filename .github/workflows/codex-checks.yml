name: Shared assistant checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install development formatters
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
      - name: Check formatting and Python imports
        run: |
          python -m ruff check .
          python -m ruff format --check .
          npm run format:check
      - name: Claude and Codex adapters, shared gameplay and update tests (no AI account needed)
        run: python -m unittest discover -s tests -v
      - name: Build Forge mod
        working-directory: mod
        run: bash gradlew checkJavaFormat build --console=plain
