name: Shared assistant checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Claude and Codex adapters, shared gameplay and update tests (no AI account needed)
        run: python -m unittest discover -s tests -v
      - name: Build Forge mod
        working-directory: mod
        run: bash gradlew build --console=plain
